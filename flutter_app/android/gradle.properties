org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier disabled: all Flutter packages are already AndroidX.
# Keeping it enabled causes transform failures on Java-21-compiled jars (class version 65).
android.enableJetifier=false
# Disable Kotlin incremental compilation to avoid "different roots" daemon crash on Windows.
kotlin.incremental=false
