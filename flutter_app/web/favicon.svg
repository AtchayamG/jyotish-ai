<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A1F3D"/>
      <stop offset="100%" stop-color="#0D0B14"/>
    </radialGradient>
    <radialGradient id="starGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C8860A"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Eight-pointed star (Jyotish / Vedic symbol) -->
  <polygon
    points="32,8 35.5,26.5 52,22 38,32 52,42 35.5,37.5 32,56 28.5,37.5 12,42 26,32 12,22 28.5,26.5"
    fill="url(#starGrad)"
    opacity="0.95"
  />
  <!-- Centre dot -->
  <circle cx="32" cy="32" r="3.5" fill="#FFF8DC" opacity="0.9"/>
</svg>
