name: Flutter Web — Build & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 3. Dependencies
      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      # 4. Build Flutter web
      #    base-href /jyotish-ai/ → served at https://atchayamg.github.io/jyotish-ai/
      - name: Build Flutter web
        working-directory: flutter_app
        run: |
          flutter build web \
            --release \
            --base-href /jyotish-ai/ \
            --dart-define=BACKEND_URL=https://jyotish-ai-backend.onrender.com

      # 5. Embed admin portal at /admin/ inside the same build output
      #    Result: https://atchayamg.github.io/jyotish-ai/admin/
      - name: Copy admin portal into /admin/ subfolder
        run: |
          mkdir -p flutter_app/build/web/admin
          cp backend/admin/index.html flutter_app/build/web/admin/index.html

      # 6. Configure Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 7. Upload combined output (Flutter at root + admin at /admin/)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

      # 8. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
